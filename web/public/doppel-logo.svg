<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 4 392 86" role="img" aria-label="DoppelForge">
  <title>DoppelForge</title>
  <defs>
    <style>
      .word {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-weight: 800;
        font-size: 60px;
        letter-spacing: -1.5px;
      }
    </style>
  </defs>
  <!-- back word: the "original" receded behind -->
  <text x="20" y="58" class="word" fill="#a875e0" fill-opacity="0.32">DoppelForge</text>
  <!-- front word: the "copy" offset right and down -->
  <text x="34" y="70" class="word" fill="#a875e0">DoppelForge</text>
</svg>
