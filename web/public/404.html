<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0e13" />
    <meta name="referrer" content="no-referrer" />

    <title>Page not found - DoppelForge</title>
    <meta name="description" content="That page doesn't exist on DoppelForge. Head back to the tool or read about how it works." />
    <meta name="robots" content="noindex, follow" />

    <link rel="icon" type="image/svg+xml" href="/doppel-favicon.svg" />
    <link rel="apple-touch-icon" href="/doppel-favicon.svg" />

    <style>
      :root {
        --bg: #0d0e13;
        --bg-elev: #14151c;
        --border: #2a2d39;
        --text: #b4b8c2;
        --text-dim: #9197a4;
        --text-h: #d6d9e1;
        --accent: #a875e0;
        --accent-soft: rgba(168, 117, 224, 0.12);
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SF Mono", Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topnav {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-elev);
      }
      .topnav-inner {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .topnav a {
        color: var(--text-dim);
        text-decoration: none;
        font-size: 14px;
      }
      .topnav a:hover { color: var(--text-h); }
      .topnav .brand {
        display: inline-flex;
        align-items: center;
        color: var(--text-h);
        font-weight: 600;
        text-decoration: none;
      }
      .topnav .brand-logo {
        height: 24px;
        width: auto;
        display: block;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
      }
      .panel {
        max-width: 540px;
        text-align: center;
      }
      .ghost {
        height: 88px;
        width: auto;
        opacity: 0.85;
        margin: 0 0 8px;
      }
      .code {
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 8px;
      }
      h1 {
        color: var(--text-h);
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 12px;
      }
      p.lede {
        color: var(--text);
        font-size: 17px;
        margin: 0 0 28px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid var(--border);
        transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #15101e;
      }
      .btn-primary:hover {
        background: #b98ce6;
        border-color: #b98ce6;
      }
      .btn-secondary {
        background: var(--accent-soft);
        color: var(--text-h);
      }
      .btn-secondary:hover {
        border-color: var(--accent);
        color: var(--text-h);
      }
      footer.site {
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
        padding: 24px;
        border-top: 1px solid var(--border);
        color: var(--text-dim);
        font-size: 13px;
        text-align: center;
      }
      footer.site a { color: var(--text-dim); }
      footer.site a:hover { color: var(--text-h); }
    </style>
  </head>
  <body>
    <nav class="topnav" aria-label="Primary">
      <div class="topnav-inner">
        <a href="/" class="brand" aria-label="DoppelForge home">
          <img src="/doppel-logo.svg" alt="DoppelForge" class="brand-logo" />
        </a>
        <a href="/about">About</a>
      </div>
    </nav>

    <main>
      <div class="panel">
        <img src="/doppel-logo-ghost.svg" alt="" class="ghost" aria-hidden="true" />
        <p class="code">Error 404</p>
        <h1>This page is a doppelgänger that doesn't exist</h1>
        <p class="lede">
          The address you followed doesn't match anything in the workshop.
          It may have moved, or never been forged at all.
        </p>
        <div class="actions">
          <a href="/" class="btn btn-primary">Open the tool</a>
          <a href="/about" class="btn btn-secondary">Learn more</a>
        </div>
      </div>
    </main>

    <footer class="site">
      <p>
        MIT licensed ·
        <a href="https://github.com/javadogwebdesign/doppelforge" rel="noopener">GitHub</a> ·
        <a href="/">Open the tool</a>
      </p>
    </footer>
  </body>
</html>
