  "data.orders.pageInfo.startCursor":     { type: id }
  "data.orders.pageInfo.endCursor":       { type: id }
  "data.orders.edges[].cursor":           { type: id }
  "data.orders.edges[].node.id":                  { type: id, anchor: true }
