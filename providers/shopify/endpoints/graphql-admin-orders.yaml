endpoint:
  method: POST
  path: /admin/api/2024-10/graphql.json (query orders)
  description: Shopify Admin GraphQL — orders connection (list)
  doc_url: https://shopify.dev/docs/api/admin-graphql/latest/queries/orders

signature:
  required_paths:
    - data.orders.edges[].node.id
    - data.orders.edges[].node.name
    - data.orders.edges[].node.totalPriceSet.shopMoney.amount
    - data.orders.pageInfo.hasNextPage
    - data.orders.edges[].cursor
  optional_paths:
    - extensions.cost.actualQueryCost
    - data.orders.edges[].node.email
    - data.orders.edges[].node.customer

fields:
  "extensions.cost.requestedQueryCost":  { type: preserve }
  "extensions.cost.actualQueryCost":     { type: preserve }
