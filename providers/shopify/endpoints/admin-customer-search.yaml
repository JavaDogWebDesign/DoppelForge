endpoint:
  method: GET
  path: /admin/api/2024-01/customers/search.json
  description: Search customers
  doc_url: https://shopify.dev/docs/api/admin-rest/2024-01/resources/customer

# Same payload shape as the customers list — just match a different URL.
signature:
  required_paths:
    - customers[].id
    - customers[].email
    - customers[].admin_graphql_api_id
  optional_paths:
    - customers[].verified_email
    - customers[].state

fields:
  "customers[].id":                     { type: id, anchor: true }
  "customers[].email":                  { type: email, anchor: true }
  "customers[].first_name":             { type: firstName }
  "customers[].last_name":              { type: lastName }
  "customers[].phone":                  { type: phone }
  "customers[].state":                  { type: preserve }
  "customers[].note":                   { type: shortText }
  "customers[].verified_email":         { type: preserve }
  "customers[].tax_exempt":             { type: preserve }
  "customers[].tags":                   { type: preserve }
  "customers[].currency":               { type: preserve }
  "customers[].orders_count":           { type: preserve }
  "customers[].total_spent":            { type: preserve }
  "customers[].last_order_id":          { type: id, anchor: true }
  "customers[].last_order_name":        { type: id, anchor: true }
  "customers[].created_at":             { type: isoDate }
  "customers[].updated_at":             { type: isoDate }
  "customers[].admin_graphql_api_id":   { type: preserve }
  "customers[].default_address.id":             { type: id, anchor: true }
  "customers[].default_address.customer_id":    { type: id, anchor: true }
  "customers[].default_address.first_name":     { type: firstName }
  "customers[].default_address.last_name":      { type: lastName }
  "customers[].default_address.address1":       { type: street }
  "customers[].default_address.address2":       { type: streetSecondary }
  "customers[].default_address.city":           { type: city }
  "customers[].default_address.province":       { type: stateOrProvince }
  "customers[].default_address.country":        { type: country }
  "customers[].default_address.country_code":   { type: countryCode }
  "customers[].default_address.zip":            { type: postalCode }
  "customers[].default_address.phone":          { type: phone }
  "*": { type: auto }
