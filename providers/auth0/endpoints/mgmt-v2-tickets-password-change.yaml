endpoint:
  method: POST
  path: /api/v2/tickets/password-change
  description: Create a password change ticket (Management API v2)
  doc_url: https://auth0.com/docs/api/management/v2/tickets/post-password-change

# Response is a single object containing the tokenized password-change URL.
# The URL is secret — anyone who has it can change the user's password — so
# it's redacted rather than fake-encoded.
signature:
  required_paths:
    - ticket
  optional_paths: []

fields:
  "ticket": { type: redact }
  "*": { type: auto }
