  "data.uiapi.query.Contact.edges[].node.MailingAddress.Street.value":     { type: street }
  "data.uiapi.query.Contact.edges[].node.MailingAddress.City.value":       { type: city }
  "data.uiapi.query.Contact.edges[].node.MailingAddress.State.value":      { type: stateOrProvince }
