endpoint:
  method: POST
  path: charge.succeeded
  kind: webhook
  description: Stripe webhook — charge succeeded
  doc_url: https://docs.stripe.com/api/events/types#event_types-charge.succeeded

signature:
  required_paths:
    - id
    - object
    - type
    - data.object.object
    - data.object.amount_captured
  optional_paths:
    - data.object.payment_intent
    - data.object.billing_details
    - data.object.receipt_url

fields:
  "id":                                           { type: id, anchor: true }
  "object":                                       { type: preserve }
  "api_version":                                  { type: preserve }
  "created":                                      { type: unixTimestamp }
  "livemode":                                     { type: preserve }
  "pending_webhooks":                             { type: preserve }
  "type":                                         { type: preserve }
  "account":                                      { type: id, anchor: true }
  "request.id":                                   { type: id, anchor: true }
  "request.idempotency_key":                      { type: id, anchor: true }
  "data.object.id":                               { type: id, anchor: true }
  "data.object.object":                           { type: preserve }
  "data.object.amount":                           { type: preserve }
  "data.object.amount_captured":                  { type: preserve }
  "data.object.amount_refunded":                  { type: preserve }
  "data.object.application":                      { type: id, anchor: true }
  "data.object.application_fee":                  { type: id, anchor: true }
  "data.object.application_fee_amount":           { type: preserve }
  "data.object.balance_transaction":              { type: id, anchor: true }
  "data.object.billing_details.address.city":         { type: city }
  "data.object.billing_details.address.country":      { type: countryCode }
  "data.object.billing_details.address.line1":        { type: street }
  "data.object.billing_details.address.line2":        { type: streetSecondary }
  "data.object.billing_details.address.postal_code":  { type: postalCode }
  "data.object.billing_details.address.state":        { type: stateOrProvince }
  "data.object.billing_details.email":            { type: email, anchor: true }
  "data.object.billing_details.name":             { type: fullName }
  "data.object.billing_details.phone":            { type: phone }
  "data.object.calculated_statement_descriptor":  { type: preserve }
  "data.object.captured":                         { type: preserve }
  "data.object.created":                          { type: unixTimestamp }
  "data.object.currency":                         { type: preserve }
  "data.object.customer":                         { type: id, anchor: true }
  "data.object.description":                      { type: shortText }
  "data.object.disputed":                         { type: preserve }
  "data.object.failure_code":                     { type: preserve }
  "data.object.failure_message":                  { type: shortText }
  "data.object.invoice":                          { type: id, anchor: true }
  "data.object.livemode":                         { type: preserve }
  "data.object.metadata":                         { type: preserve }
  "data.object.outcome.network_status":           { type: preserve }
  "data.object.outcome.reason":                   { type: preserve }
  "data.object.outcome.risk_level":               { type: preserve }
  "data.object.outcome.risk_score":               { type: preserve }
  "data.object.outcome.seller_message":           { type: shortText }
  "data.object.outcome.type":                     { type: preserve }
  "data.object.paid":                             { type: preserve }
  "data.object.payment_intent":                   { type: id, anchor: true }
  "data.object.payment_method":                   { type: id, anchor: true }
  "data.object.payment_method_details.type":      { type: preserve }
  "data.object.payment_method_details.card.brand":     { type: preserve }
  "data.object.payment_method_details.card.country":   { type: countryCode }
  "data.object.payment_method_details.card.exp_month": { type: preserve }
  "data.object.payment_method_details.card.exp_year":  { type: preserve }
  "data.object.payment_method_details.card.fingerprint": { type: id, anchor: true }
  "data.object.payment_method_details.card.funding":   { type: preserve }
  "data.object.payment_method_details.card.last4":     { type: id }
  "data.object.payment_method_details.card.network":   { type: preserve }
  "data.object.receipt_email":                    { type: email, anchor: true }
  "data.object.receipt_number":                   { type: id, anchor: true }
  "data.object.receipt_url":                      { type: url }
  "data.object.refunded":                         { type: preserve }
  "data.object.shipping.address.city":            { type: city }
  "data.object.shipping.address.country":         { type: countryCode }
  "data.object.shipping.address.line1":           { type: street }
  "data.object.shipping.address.line2":           { type: streetSecondary }
  "data.object.shipping.address.postal_code":     { type: postalCode }
  "data.object.shipping.address.state":           { type: stateOrProvince }
  "data.object.shipping.name":                    { type: fullName }
  "data.object.shipping.phone":                   { type: phone }
  "data.object.shipping.tracking_number":         { type: id, anchor: true }
  "data.object.shipping.carrier":                 { type: company }
  "data.object.statement_descriptor":             { type: preserve }
  "data.object.status":                           { type: preserve }
  "data.object.transfer_group":                   { type: id }
  "*": { type: auto }
