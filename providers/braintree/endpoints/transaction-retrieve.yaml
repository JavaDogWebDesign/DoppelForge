endpoint:
  method: GET
  path: /merchants/{merchant_id}/transactions/{transaction_id}
  description: Retrieve a transaction (SDK Transaction.find — flat object)
  doc_url: https://developer.paypal.com/braintree/docs/reference/response/transaction

# Braintree SDKs (Ruby/Node/Python/PHP/Java) return Transaction objects that
# serialize as a flat JSON object — no top-level "transaction" wrapper. Raw
# REST/XML responses do wrap; users mostly see the flat form in logs.
signature:
  required_paths:
    - id
    - type
    - amount
    - status
    - currency_iso_code
  optional_paths:
    - credit_card
    - billing
    - customer

