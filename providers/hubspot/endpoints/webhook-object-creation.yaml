endpoint:
  method: POST
  path: "*.creation"
  kind: webhook
  description: HubSpot webhook — object creation events (contact/deal/company/ticket share shape)
  doc_url: https://developers.hubspot.com/docs/api/webhooks

signature:
  required_paths:
    - "[].eventId"
    - "[].subscriptionType"
    - "[].portalId"
    - "[].appId"
    - "[].occurredAt"
    - "[].objectId"
    - "[].changeSource"
  optional_paths:
    - "[].attemptNumber"
    - "[].sourceId"

fields:
  "[].eventId":          { type: id, anchor: true }
  "[].subscriptionId":   { type: id, anchor: true }
  "[].portalId":         { type: id, anchor: true }
  "[].appId":            { type: id, anchor: true }
  "[].occurredAt":       { type: preserve }
  "[].subscriptionType": { type: preserve }
  "[].attemptNumber":    { type: preserve }
  "[].objectId":         { type: id, anchor: true }
  "[].changeSource":     { type: preserve }
  "[].sourceId":         { type: id, anchor: true }
  "*": { type: auto }
