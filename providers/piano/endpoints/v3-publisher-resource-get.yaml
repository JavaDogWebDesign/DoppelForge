endpoint:
  method: GET
  path: /api/v3/publisher/resource/get
  description: Get a resource
  doc_url: https://docs.piano.io/api/

signature:
  required_paths:
    - resource.rid
    - resource.aid
    - resource.name
    - code
  optional_paths:
    - resource.description
    - resource.bundle

fields:
  "code":   { type: preserve }
  "ts":     { type: preserve }
  "resource.rid":              { type: id, anchor: true }
  "resource.aid":              { type: id, anchor: true }
  "resource.name":             { type: shortText }
  "resource.description":      { type: shortText }
  "resource.image_url":        { type: url }
  "resource.purchase_url":     { type: url }
  "resource.type":             { type: preserve }
  "resource.type_label":       { type: preserve }
  "resource.disabled":         { type: preserve }
  "resource.bundle":           { type: preserve }
  "resource.bundle_type":      { type: preserve }
  "resource.is_fbia_resource": { type: preserve }
  "resource.publish_date":     { type: unixTimestamp }
  "resource.create_date":      { type: unixTimestamp }
  "resource.update_date":      { type: unixTimestamp }
  "resource.external_id":      { type: id, anchor: true }
  "*": { type: auto }
